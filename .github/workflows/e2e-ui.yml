name: e2e-ui

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "lib/**"
      - "e2e-ui/**"
      - ".github/workflows/e2e-ui.yml"
  pull_request:
    paths:
      - "app/**"
      - "lib/**"
      - "e2e-ui/**"
      - ".github/workflows/e2e-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # azureedge.net CDN is dead; npmmirror keeps driver builds >= 1.55
      PLAYWRIGHT_DOWNLOAD_HOST: https://registry.npmmirror.com/-/binary/playwright

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
        id: go

      - name: go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      # browser binaries depend on the playwright-go version pinned in the
      # install step below, not on go.sum; keying on go.sum reinstalled
      # chromium on every dependency bump
      - name: cache playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('.github/workflows/e2e-ui.yml') }}

      - name: install playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: go run github.com/playwright-community/playwright-go/cmd/playwright@v0.6000.0 install --with-deps chromium

      - name: install playwright deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: go run github.com/playwright-community/playwright-go/cmd/playwright@v0.6000.0 install-deps chromium

      - name: run e2e ui tests
        run: go test -v -count=1 -timeout=5m -tags=e2e ./e2e-ui/...
