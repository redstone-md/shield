name: build-updater
on:
  push:
    branches:
    tags:
    paths:
      - "updater/**"
      - ".github/workflows/updater.yml"
  pull_request:
    paths:
      - "updater/**"
      - ".github/workflows/updater.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build only (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: updater/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            CI=github
            GITHUB_SHA=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}

      - name: build and push to ghcr.io
        id: build-ghcr
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: updater/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            CI=github
            GITHUB_SHA=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/shield-updater,push-by-digest=true,name-canonical=true,push=true

      - name: export digests
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests/ghcr
          digest_ghcr="${{ steps.build-ghcr.outputs.digest }}"
          touch "/tmp/digests/ghcr/${digest_ghcr#sha256:}"

      - name: upload ghcr digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-ghcr-${{ matrix.artifact }}
          path: /tmp/digests/ghcr/*
          retention-days: 1

  merge:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: download ghcr digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests/ghcr
          pattern: digests-ghcr-*
          merge-multiple: true

      - name: verify all digests present
        run: |
          expected=2
          actual=$(find /tmp/digests/ghcr -maxdepth 1 -type f | wc -l)
          if [ "$actual" -ne "$expected" ]; then
            echo "Expected $expected digests for ghcr, found $actual"
            ls -la /tmp/digests/ghcr
            exit 1
          fi
          echo "All $expected digests present for ghcr"

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: login to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set docker tags
        id: tags
        env:
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GIT_REF" == refs/tags/* ]]; then
            echo "tag=${GIT_REF_NAME}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "tag=${GIT_REF_NAME}" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: create ghcr manifest and push
        working-directory: /tmp/digests/ghcr
        run: |
          tags="-t ghcr.io/${{ github.repository_owner }}/shield-updater:${{ steps.tags.outputs.tag }}"
          if [[ "${{ steps.tags.outputs.is_release }}" == "true" ]]; then
            tags="$tags -t ghcr.io/${{ github.repository_owner }}/shield-updater:latest"
          fi
          docker buildx imagetools create $tags \
            $(printf 'ghcr.io/${{ github.repository_owner }}/shield-updater@sha256:%s ' *)
