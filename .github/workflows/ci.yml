name: build-app
on:
  push:
    branches:
    tags:
    paths-ignore:
      - ".github/workflows/updater.yml"
      - "updater/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - ".github/workflows/updater.yml"
      - "updater/**"
      - "**.md"

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: set up go
      uses: actions/setup-go@v7
      with:
        go-version: "1.25"
      id: go

    # setup-go caches only the module download dir, which is unused here
    # because the build runs from vendor/; the compile cache is what makes
    # the race builds slow on a cold runner
    - name: go build cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/go-build
        key: ${{ runner.os }}-go-build-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', '_examples/simplechat/go.mod') }}
        restore-keys: |
          ${{ runner.os }}-go-build-

    - name: build and test
      run: |
        go test -v -race -timeout=180s -covermode=atomic -coverprofile=$GITHUB_WORKSPACE/profile.cov_tmp ./...
        go build -race ./...
        cat $GITHUB_WORKSPACE/profile.cov_tmp | grep -v "mocks" | grep -v "_mock" > $GITHUB_WORKSPACE/profile.cov
      env:
        TZ: "America/Chicago"

    - name: test examples
      run: |
        go test -race ./...
        go build -race ./...
      working-directory: _examples/simplechat
      env:
        TZ: "America/Chicago"

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest

    - name: golangci-lint on example directory
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        args: --config ../../.golangci.yml
        working-directory: _examples/simplechat

    - name: submit coverage
      run: |
        go install github.com/mattn/goveralls@latest
        goveralls -service="github" -coverprofile=$GITHUB_WORKSPACE/profile.cov
      env:
        COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
