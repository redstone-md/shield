# production compose with postgres storage, cloudflared tunnel and logging
services:
  shield:
    build:
      context: ..
      dockerfile: Dockerfile
    image: shield:local
    hostname: shield
    container_name: shield
    restart: always
    logging: &default_logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - .env
    volumes:
      - ./logs:/srv/logs
    ports:
      - "127.0.0.1:8080:8080"

  postgres:
    image: postgres:17
    hostname: postgres
    container_name: postgres
    restart: always
    logging: *default_logging
    environment:
      - POSTGRES_USER=tg-spam
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=tg-spam
    volumes:
      - pg-data:/var/lib/postgresql/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    depends_on:
      - shield
    env_file:
      - .env.shield.local
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARED_TOKEN}

volumes:
  pg-data:
