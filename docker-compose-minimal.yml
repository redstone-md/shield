 # example of a minimal compose file to run tg-spam
 # copy .env.example to .env and fill in values before starting
 services:
   tg-spam:
     build:
       context: ..
       dockerfile: Dockerfile
     image: tg-spam:minimal
     hostname: tg-spam
     restart: always
     container_name: tg-spam
     env_file:
       - .env
     logging:
       driver: json-file
       options:
         max-size: "10m"
         max-file: "5"
     volumes:
       - ./var:/srv/data
