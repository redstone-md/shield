 # example of a minimal compose file to run shield
 # copy .env.example to .env and fill in values before starting
 services:
   shield:
     build:
       context: ..
       dockerfile: Dockerfile
     image: shield:minimal
     hostname: shield
     restart: always
     container_name: shield
     env_file:
       - .env
     logging:
       driver: json-file
       options:
         max-size: "10m"
         max-file: "5"
     volumes:
       - ./var:/srv/data
