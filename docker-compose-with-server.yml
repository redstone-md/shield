# production: tg-spam with web UI, cloudflare tunnel, logging, named volume
# copy .env.example to .env and fill in values before starting
services:
  tg-spam:
    build:
      context: .
    image: tg-spam:local
    hostname: tg-spam
    container_name: tg-spam
    restart: always
    logging: &default_logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - .env
    volumes:
      - tg-data:/srv/data
      - ./logs:/srv/logs

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    depends_on:
      - tg-spam
    env_file:
      - .env
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARED_TOKEN}

volumes:
  tg-data:
