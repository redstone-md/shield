# standard tgadmin compose setup: tg-spam web UI behind a Cloudflare tunnel
# copy .env.example to .env and create .env.tg-spam.local with CLOUDFLARED_TOKEN before starting
services:
  tg-spam:
    build:
      context: .
    image: tg-spam:local
    container_name: tg-spam
    hostname: tg-spam
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./var/tg-spam:/srv/data
      - ./logs:/srv/logs
    ports:
      - "127.0.0.1:8080:8080"

  cloudflared-tgadmin:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tgadmin
    restart: unless-stopped
    depends_on:
      - tg-spam
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARED_TOKEN:?set CLOUDFLARED_TOKEN in .env or shell}
