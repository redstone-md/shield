# standard tgadmin compose setup: shield web UI behind a Cloudflare tunnel
# copy .env.example to .env and set CLOUDFLARED_TOKEN before starting
services:
  shield:
    build:
      context: .
    image: shield:local
    container_name: shield
    hostname: shield
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./var/tg-spam:/srv/data
      - ./logs:/srv/logs
    ports:
      - "127.0.0.1:8080:8080"

  cloudflared-tgadmin:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tgadmin
    restart: unless-stopped
    depends_on:
      - shield
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARED_TOKEN:?set CLOUDFLARED_TOKEN in .env or shell}
